<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Alhadad</title>
  <link rel="icon" href="/global/site-icon.png" />
  <link rel="stylesheet" href="/globals.css" />
  <link rel="stylesheet" href="/css/transition.css" />
  <link rel="stylesheet" href="/css/menu.css" />
  <link rel="stylesheet" href="/css/contact.css" />
</head>

<body>
  <div class="transition">
    <div class="transition-overlay overlay"></div>
    <div class="transition-logo">
      <img src="/global/logo.png" alt="Logo" />
    </div>
  </div>
  <div class="mask-transition"></div>
  <div class="mask-bg-overlay"></div>

  <nav class="menu">
    <div class="menu-header">
      <a href="#" class="menu-logo"><img src="/global/logo.png" alt="" /></a>
      <button class="menu-toggle" aria-label="Toggle menu">
        <div class="menu menu-hamburger-icon">
          <span class="menu-item"></span>
          <span class="menu-item"></span>
        </div>
      </button>
    </div>
    <div class="menu-overlay">
      <nav class="menu-nav">
        <ul>
          <li><a href="/">Index</a></li>
          <li><a href="/about">The Dev</a></li>
          <li><a href="/work">Cool Stuff</a></li>
          <li><a href="/project">Log 01</a></li>
          <li><a href="/contact">Ping Me</a></li>
        </ul>
      </nav>
      <div class="menu-footer">
        <div class="menu-social">
          <a href="#"><span>&#9654;</span> Instagram</a>
          <a href="#"><span>&#9654;</span> LinkedIn</a>
        </div>
        <div class="menu-time">23:24:02 NY</div>
      </div>
    </div>
  </nav>

  <section class="contact">
    <div class="home-spotlight-top-bar">
      <div class="container">
        <div class="symbols-container">
          <div class="symbol">
            <img src="/symbols/s1-light.png" alt="Symbol" />
          </div>
        </div>
        <div class="symbols-container">
          <div class="symbol">
            <img src="/symbols/s1-light.png" alt="Symbol" />
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="contact-header">
        <div class="contact-callout">
          <p class="mono" data-animate-type="scramble" data-animate-delay="0.25">
            <span>&#9654;</span> Email: hey@junowatts.com
          </p>
        </div>
        <div class="contact-header-title">
          <h2 data-animate-type="line-reveal" data-animate-delay="0.25">
            Summon Juno to Your Project
          </h2>
        </div>

        <!-- Contact Form -->
        <form class="contact-form" id="contact-form" novalidate>
          <div class="contact-form-row">
            <div class="contact-form-field">
              <label class="mono" for="cf-name"><span>&#9654;</span> Name</label>
              <input type="text" id="cf-name" name="sender_name" placeholder="Your name" autocomplete="name" required />
            </div>
            <div class="contact-form-field">
              <label class="mono" for="cf-email"><span>&#9654;</span> Email</label>
              <input type="email" id="cf-email" name="sender_email" placeholder="your@email.com" autocomplete="email" required />
            </div>
          </div>
          <div class="contact-form-field">
            <label class="mono" for="cf-message"><span>&#9654;</span> Message</label>
            <textarea id="cf-message" name="message" placeholder="Tell me about your project..." rows="4" required></textarea>
          </div>
          <div class="contact-form-footer">
            <p class="mono contact-form-status" id="cf-status"></p>
            <button type="submit" class="contact-form-btn" id="cf-submit">
              <span class="mono">Send it &#9654;</span>
            </button>
          </div>
        </form>
      </div>
      <div class="contact-gif">
        <img src="/contact/contact.gif" alt="" />
      </div>
    </div>
    <div class="home-spotlight-bottom-bar">
      <div class="container">
        <p class="mono" data-animate-type="scramble" data-animate-delay="0.25">
          <span>&#9654;</span> Instagram
        </p>
        <p class="mono" data-animate-type="scramble" data-animate-delay="0.25">
          <span>&#9654;</span> Twitter / X
        </p>
        <p class="mono" data-animate-type="scramble" data-animate-delay="0.25">
          <span>&#9654;</span> YouTube
        </p>
        <p class="mono" data-animate-type="scramble" data-animate-delay="0.25">
          <span>&#9654;</span> LinkedIn
        </p>
      </div>
    </div>
  </section>

  <script type="module" src="/script/lenis-scroll.js"></script>
  <script type="module" src="/script/transition.js"></script>
  <script type="module" src="/script/menu.js"></script>
  <script type="module" src="/script/contact.js"></script>
</body>

</html>
